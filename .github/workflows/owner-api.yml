name: Owner API and runtime contracts
on:
  pull_request:
  push:
    branches: [feat/real-agent-mobile-vm]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test molla-cli/tests/*.test.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: molla-app/apps/api
      - run: pnpm test
        working-directory: molla-app/apps/api
      - run: python molla-app/apps/api/tests/cloud_worker_test.py
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: molla-app
      - run: node --test tests/*.test.mjs
        working-directory: molla-app
